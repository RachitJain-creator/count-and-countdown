<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Count &amp; countdown</title>
<style>
  :root { color-scheme: light; font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; color: #19223d; background: #f4f7fc; }
  * { box-sizing: border-box; }
  body { margin: 0; min-height: 100vh; background: #f4f7fc; }
  main { width: min(100% - 48px, 900px); margin: 18px auto 48px; }
  h1 { font-size: 32px; line-height: 1.25; letter-spacing: -.6px; margin: 0 0 26px; font-weight: 650; }
  label { display: block; font-size: 19px; line-height: 1.35; margin-bottom: 8px; }
  input, select, button { width: 100%; height: 62px; border: 1px solid #c8d3e5; border-radius: 14px; padding: 0 16px; background: #fff; color: #202a45; font: inherit; font-size: 19px; outline: none; }
  input:focus, select:focus { border-color: #687faa; box-shadow: 0 0 0 3px #dce5f5; }
  .field { min-width: 0; }
  .mode { margin-bottom: 24px; }
  .row { display: grid; grid-template-columns: 1fr 1fr; gap: 15px; margin-bottom: 20px; }
  .hint { font-size: 16px; color: #5e6d8b; margin: 22px 0 0; }
  [hidden] { display: none !important; }
  .timer-screen { min-height: 100vh; padding: 14px 36px; display: flex; align-items: center; }
  .timer-card { width: 100%; min-height: 304px; padding: 44px 40px 38px; background: #fff; border: 1px solid #d9e1ee; border-radius: 29px; display: flex; flex-direction: column; justify-content: center; }
  .event-title { font-size: 23px; margin-bottom: 48px; }
  .time { font-size: clamp(60px, 7vw, 80px); line-height: 1.05; letter-spacing: -2px; font-variant-numeric: tabular-nums; font-weight: 700; white-space: nowrap; }
  .description { font-size: 20px; margin-top: 34px; }
  @media (max-width: 600px) {
    main { width: min(100% - 32px, 900px); margin-top: 22px; }
    h1 { font-size: 28px; }
    .row { grid-template-columns: 1fr; gap: 18px; }
    .timer-screen { padding: 16px; }
    .timer-card { min-height: 260px; padding: 30px 24px; border-radius: 22px; }
    .event-title { font-size: 20px; margin-bottom: 34px; }
    .time { font-size: clamp(42px, 11vw, 64px); letter-spacing: -1.4px; }
    .description { font-size: 17px; margin-top: 27px; }
  }
</style>
</head>
<body>
<main id="setup">
  <h1>Count &amp; countdown</h1>
  <div class="field mode"><label for="mode">Mode</label><select id="mode"><option value="down">Event countdown</option><option value="up">Count up from a date</option></select></div>
  <div class="row">
    <div class="field"><label for="eventName">Event name</label><input id="eventName" type="text" value="CA Final Exam" placeholder="Name your event"></div>
    <div class="field"><label for="chooseDate">Timer date and time</label><button id="chooseDate" type="button">Choose date &amp; time</button><input id="eventDate" type="datetime-local" value="" hidden></div>
  </div>
  <p class="hint">Choose a date and time to start the full-screen timer.</p>
</main>
<section class="timer-screen" id="timerScreen" aria-live="polite" hidden>
  <div class="timer-card">
    <div class="event-title" id="displayName"></div>
    <div class="time" id="time"></div>
    <div class="description" id="description"></div>
  </div>
</section>
<script>
  const mode = document.querySelector('#mode');
  const nameInput = document.querySelector('#eventName');
  const dateInput = document.querySelector('#eventDate');
  const setup = document.querySelector('#setup');
  const timerScreen = document.querySelector('#timerScreen');
  const displayName = document.querySelector('#displayName');
  const timeOutput = document.querySelector('#time');
  const description = document.querySelector('#description');
  let started = false;
  function render() {
    const name = nameInput.value.trim() || 'Your event';
    displayName.textContent = name;
    const isUp = mode.value === 'up';
    const target = new Date(dateInput.value).getTime();
    if (!dateInput.value || Number.isNaN(target)) return;
    let seconds = Math.floor(Math.abs(target - Date.now()) / 1000);
    const days = Math.floor(seconds / 86400); seconds %= 86400;
    const hours = Math.floor(seconds / 3600); seconds %= 3600;
    const minutes = Math.floor(seconds / 60); seconds %= 60;
    const clock = [hours, minutes, seconds].map(n => String(n).padStart(2, '0')).join(':');
    const elapsed = target <= Date.now();
    timeOutput.textContent = `${days}d ${clock}`;
    description.textContent = !isUp && elapsed ? `${name} has passed.` : isUp && !elapsed ? 'Your date is still in the future.' : isUp ? 'Counting up from your date.' : 'Counting down to your event.';
    if (!started) {
      started = true;
      setup.hidden = true;
      timerScreen.hidden = false;
    }
  }
  dateInput.addEventListener('change', render);
  dateInput.addEventListener('input', render);
  document.querySelector('#chooseDate').addEventListener('click', () => {
    if (dateInput.showPicker) dateInput.showPicker();
    else dateInput.click();
  });
  [mode, nameInput].forEach(el => el.addEventListener('input', render));
  document.addEventListener('keydown', event => {
    if (event.key === 'Escape' && started) {
      started = false;
      setup.hidden = false;
      timerScreen.hidden = true;
    }
  });
  render();
  setInterval(render, 1000);
</script>
</body>
</html>
